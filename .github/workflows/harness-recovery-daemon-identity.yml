name: Harness Recovery Daemon Identity

on:
  pull_request:
    branches: [master]
    paths:
      - "crates/jcode-protocol/**"
      - "crates/jcode-app-core/src/server/**"
      - ".github/workflows/harness-recovery-daemon-identity.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: stable
  CARGO_TERM_COLOR: always

jobs:
  daemon-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: harness-recovery-daemon-identity
      - name: Check protocol and server crates
        run: cargo check -p jcode-protocol -p jcode-app-core
      - name: Run daemon identity native test
        shell: bash
        run: |
          set -euo pipefail
          output="$(cargo test -p jcode-app-core --lib debug_accept_loop_responds_to_ping_without_affecting_client_count -- --nocapture 2>&1)"
          printf '%s\n' "$output"
          if grep -Eq 'running 0 tests|0 passed; 0 failed;.*filtered out' <<<"$output"; then
            echo "Targeted daemon identity test did not execute" >&2
            exit 1
          fi
          grep -Eq 'test .*debug_accept_loop_responds_to_ping_without_affecting_client_count .* ok' <<<"$output"

name: Publish TypeScript SDK

env:
  JCODE_CI: "1"

on:
  workflow_dispatch:
    inputs:
      jcode_release_tag:
        description: Released jcode tag whose binaries should be bundled
        required: true

permissions:
  contents: read

jobs:
  publish:
    name: Publish @1jehuang/jcode-sdk
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Enforce Rust and TypeScript SDK surface parity
        working-directory: ${{ github.workspace }}
        run: cargo test -p jcode-sdk parity -- --nocapture

      - name: Install dependencies
        run: npm ci

      - name: Validate SDK
        run: npm run check

      - name: Download released jcode runtimes
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
          # Windows ARM64 is published only after the separate ARM64 runtime
          # qualification, so asking for that asset unconditionally makes
          # `gh release download` fail on an unqualified release.
          WINDOWS_ARM64_QUALIFIED: ${{ vars.WINDOWS_ARM64_QUALIFIED }}
        run: |
          mkdir -p sdk-runtime-assets
          patterns=(
            'kcode-linux-x86_64.tar.gz'
            'kcode-linux-aarch64.tar.gz'
            'kcode-macos-x86_64.tar.gz'
            'kcode-macos-aarch64.tar.gz'
            'kcode-windows-x86_64.tar.gz'
          )
          if [ "${WINDOWS_ARM64_QUALIFIED:-}" = 'true' ]; then
            patterns+=('kcode-windows-aarch64.tar.gz')
          else
            echo "skipping kcode-windows-aarch64.tar.gz: WINDOWS_ARM64_QUALIFIED is not 'true'"
          fi
          args=()
          for pattern in "${patterns[@]}"; do
            args+=(--pattern "$pattern")
          done
          gh release download "${{ inputs.jcode_release_tag }}" \
            --dir sdk-runtime-assets "${args[@]}"

      - name: Prepare platform packages
        working-directory: ${{ github.workspace }}
        env:
          WINDOWS_ARM64_QUALIFIED: ${{ vars.WINDOWS_ARM64_QUALIFIED }}
        run: bash scripts/prepare_sdk_runtime_packages.sh sdk-runtime-assets

      # These must exist before the main package is published. npm selects only
      # the package matching the consumer's os/cpu from optionalDependencies.
      - name: Publish platform runtime packages
        working-directory: ${{ github.workspace }}
        run: |
          for package in sdk/npm/*; do
            npm publish "$package" --access public --provenance
          done

      - name: Publish with npm provenance
        run: npm publish --access public --provenance

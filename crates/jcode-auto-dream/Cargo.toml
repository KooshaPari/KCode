[package]
name = "jcode-auto-dream"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "jcode_auto_dream"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread", "sync", "time"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
filetime = "0.2"

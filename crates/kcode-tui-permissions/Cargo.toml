[package]
name = "kcode-tui-permissions"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "kcode_tui_permissions"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
chrono = "0.4"
crossterm = { version = "0.29", features = ["event-stream"] }
kcode-base = { path = "../kcode-base", default-features = false }
kcode-core = { path = "../kcode-core" }
kcode-terminal-guard = { path = "../kcode-terminal-guard" }
kcode-tui-style = { path = "../kcode-tui-style" }
ratatui = "0.30"
serde_json = "1"

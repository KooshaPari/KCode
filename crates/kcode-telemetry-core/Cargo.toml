[package]
name = "kcode-telemetry-core"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "kcode_telemetry_core"
path = "src/lib.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
kcode-build-meta = { path = "../kcode-build-meta" }
kcode-core = { path = "../kcode-core" }
kcode-logging = { path = "../kcode-logging" }
kcode-provider-core = { path = "../kcode-provider-core" }
kcode-selfdev-types = { path = "../kcode-selfdev-types" }
kcode-storage = { path = "../kcode-storage" }
kcode-usage-types = { path = "../kcode-usage-types" }
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "charset", "http2", "system-proxy", "rustls-tls", "rustls-tls-native-roots"] }
serde_json = "1"
walkdir = "2"
tokio = { version = "1", features = ["rt"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

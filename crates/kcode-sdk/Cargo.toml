[package]
name = "kcode-sdk"
version = "0.1.0"
edition = "2024"
publish = false
description = "Rust SDK for the kcode harness API: connect, drive sessions, stream events"

[dependencies]
kcode-harness-api = { path = "../kcode-harness-api" }
kcode-provider-metadata = { path = "../kcode-provider-metadata" }
kcode-transport = { path = "../kcode-transport" }
jsonschema = { version = "0.49.3", default-features = false }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]

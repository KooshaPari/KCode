[package]
name = "kcode-provider-grok-build-runtime"
version = "0.1.0"
edition = "2024"
description = "Grok Build subscription runtime for kcode over the Grok CLI chat proxy (direct HTTPS)"

[lib]
name = "kcode_provider_grok_build_runtime"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
futures = "0.3"
# default-features = false: see kcode-provider-openrouter-runtime/Cargo.toml.
kcode-base = { path = "../kcode-base", default-features = false }
kcode-message-types = { path = "../kcode-message-types" }
kcode-provider-core = { path = "../kcode-provider-core" }
kcode-provider-openrouter-runtime = { path = "../kcode-provider-openrouter-runtime" }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }

[[bin]]
name = "kcode-fake-grok-acp"
path = "tests/fake_grok_acp_bin.rs"
required-features = []
test = false

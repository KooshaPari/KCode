# agent-sync: bidirectional sync configuration
#
# Each [[targets]] entry describes one path-pair that should be kept in
# sync between this machine and the peer. The same config file works on
# both laptop and desk — `local` is always THIS side.
#
# On the desk's WSL bash, paths under $HOME are rewritten so that the
# same "~/.jcode/skills" resolves to /mnt/c/Users/koosh/.jcode/skills
# instead of /home/user/.jcode/skills (which doesn't exist there).
#
# IMPORTANT — config files (config.toml / .forge.toml):
#   These intentionally differ between laptop and desk (desk has custom
#   provider routing; laptop has the canonical native default). Bidir
#   sync of these files can clobber a working setup on either side.
#   Use `agent-sync jcode-config --pull-only` or `--push-only` to
#   deliberately copy in one direction when you have confirmed the
#   remote copy is what you want. Default `agent-sync` skips them
#   because the entries below are tagged `manual = true`.

[connect]
default_peer = "desk"
ssh_opts = [
  "-o", "BatchMode=yes",
  "-o", "ConnectTimeout=10",
  "-o", "ServerAliveInterval=15",
  "-o", "ServerAliveCountMax=3",
]

# On WSL on the desk, the Windows user's home lives at this path.
# When this file is read inside WSL, paths beginning with the user's
# home are rewritten from /home/<user>/<rel> → <windows_home>/<rel>.
# Leave empty on macOS.
windows_home = "/mnt/c/Users/koosh"

# The HOME directory of the PEER (used to expand "~/foo" on the remote side
# of an rsync command). On macOS, set this to windows_home because the
# peer (desk) runs rsync from inside WSL where $HOME points at the Windows
# profile. On WSL, set this to the laptop user's $HOME.
#
# Leave empty to fall back to using `~/.foo` literally in the rsync URL
# (works if the peer's shell expands ~ to its $HOME for you).
remote_home = "/mnt/c/Users/koosh"

# rsync binaries
local_rsync  = "/usr/bin/rsync"
remote_rsync = "/usr/bin/rsync"

# Patterns excluded from every target.
global_excludes = [
  ".DS_Store",
  "Thumbs.db",
  "*.swp",
  "*.bak",
  "*.tmp",
  "node_modules",
  "__pycache__",
  ".cache",
  "*.pyc",
]

# ---- jcode -----------------------------------------------------------------
[[targets]]
name        = "jcode-skills"
description = "jcode: SKILL.md catalogs (~/.jcode/skills/)"
local       = "~/.jcode/skills"
remote      = "~/.jcode/skills"
excludes    = []

[[targets]]
name        = "jcode-memory"
description = "jcode: persistent memory (~/.jcode/memory/)"
local       = "~/.jcode/memory"
remote      = "~/.jcode/memory"
excludes    = []

[[targets]]
name        = "jcode-memories"
description = "jcode: project-scoped memories (~/.jcode/memories/)"
local       = "~/.jcode/memories"
remote      = "~/.jcode/memories"
excludes    = []

[[targets]]
name        = "jcode-mcp"
description = "jcode: MCP server config (~/.jcode/mcp.json)"
local       = "~/.jcode/mcp.json"
remote      = "~/.jcode/mcp.json"
excludes    = []

[[targets]]
name        = "jcode-config"
description = "jcode: top-level config.toml — DIVERGENT between sides; manual only"
local       = "~/.jcode/config.toml"
remote      = "~/.jcode/config.toml"
excludes    = []
manual      = true

